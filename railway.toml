[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.production"

[deploy]
# No startCommand: the image CMD (docker/start.sh) already runs config:cache,
# migrate and then php-fpm + nginx. A startCommand here would override that
# CMD and prevent the web server from starting.
healthcheckPath = "/up"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[variables]
APP_ENV = "production"
APP_DEBUG = "false"
APP_MAINTENANCE_DRIVER = "database"
LOG_CHANNEL = "stack"
LOG_LEVEL = "info"
SESSION_DRIVER = "database"
CACHE_STORE = "redis"
QUEUE_CONNECTION = "redis"
REDIS_CLIENT = "phpredis"
# Reference the Redis service (Railway private networking). Rename "Redis"
# if your Redis service is named differently.
REDIS_URL = "${{Redis.REDIS_URL}}"
