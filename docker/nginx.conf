server {
    listen 8080;
    server_name _;
    root /var/www/html/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # Laravel's AddLinkHeadersForPreloadedAssets middleware emits one
        # modulepreload Link entry per Vite-built asset a page pulls in.
        # nginx's 4k default fastcgi_buffer_size is enough for a page with a
        # couple of components but not for a page whose Vue tree spans many
        # SFCs (e.g. the case editor's per-section row components) — nginx
        # then rejects the response with "upstream sent too big header"
        # before it ever reaches the client, a 502 with no application-level
        # error to show for it.
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
